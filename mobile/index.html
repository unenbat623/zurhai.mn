<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astra AI Mobile</title>
    <style>
      html,body{margin:0;background:#050507;color:#f8fafc;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .critical-shell{min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(79,70,229,.16),transparent 34rem),#050507;padding-bottom:80px}
      .critical-head{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(8,8,12,.96)}
      .critical-brand{display:flex;align-items:center;gap:10px;min-width:0}.critical-logo{width:36px;height:36px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);display:grid;place-items:center;font-weight:800}.critical-kicker{font-size:10px;letter-spacing:.28em;color:#a5b4fc;font-weight:800}.critical-title{font-size:14px;font-weight:700;white-space:nowrap}.critical-vip{border-radius:999px;background:#f8d66d;color:#050507;padding:10px 14px;font-size:10px;font-weight:900}
      .critical-main{padding:20px 16px;max-width:500px;margin:0 auto}.critical-card{border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(15,15,25,.42);padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.24)}.critical-pill{display:inline-flex;border:1px solid rgba(99,102,241,.25);border-radius:999px;background:rgba(99,102,241,.1);color:#a5b4fc;padding:6px 12px;font-size:9px;letter-spacing:.2em;font-weight:900}.critical-card h1{font-size:26px;line-height:1.15;margin:18px 0 10px}.critical-card p{font-size:14px;line-height:1.55;color:#94a3b8;margin:0}.critical-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.critical-action{border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.04);padding:14px;font-size:10px;font-weight:900;letter-spacing:.12em}.critical-action span{display:block;margin-top:6px;color:#64748b;font-size:10px;font-weight:500;letter-spacing:0}
      .critical-nav{position:fixed;left:0;right:0;bottom:0;height:58px;border-top:1px solid rgba(255,255,255,.08);background:rgba(8,8,12,.98)}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="critical-shell">
        <header class="critical-head">
          <div class="critical-brand">
            <div class="critical-logo">&#9790;</div>
            <div>
              <div class="critical-kicker">ASTRA AI</div>
              <div class="critical-title">&#1058;&#1072;&#1085;&#1099; &#1079;&#1091;&#1088;&#1093;&#1072;&#1081;</div>
            </div>
          </div>
          <div class="critical-vip">VIP</div>
        </header>
        <main class="critical-main">
          <section class="critical-card">
            <div class="critical-pill">APPLICATION</div>
            <h1>&#1256;&#1085;&#1257;&#1257;&#1076;&#1088;&#1080;&#1081;&#1085; &#1086;&#1076;&#1076;&#1099;&#1085; &#1095;&#1080;&#1075;&#1083;&#1101;&#1083;</h1>
            <p>&#1055;&#1088;&#1086;&#1092;&#1072;&#1081;&#1083; &#1199;&#1199;&#1089;&#1075;&#1101;&#1101;&#1076; &#1080;&#1083;&#1199;&#1199; &#1093;&#1091;&#1074;&#1080;&#1081;&#1085; &#1079;&#1091;&#1088;&#1093;&#1072;&#1081; &#1072;&#1074;&#1072;&#1072;&#1088;&#1072;&#1081;.</p>
            <div class="critical-actions">
              <div class="critical-action">&#1055;&#1056;&#1054;&#1060;&#1040;&#1049;&#1051;<span>&#1054;&#1088;&#1076;</span></div>
              <div class="critical-action">PLUS<span>VIP</span></div>
            </div>
          </section>
        </main>
        <div class="critical-nav"></div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
